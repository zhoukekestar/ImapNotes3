name: Signed APK release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v1.4.8-microg.2)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Decode signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Test and build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon --no-configuration-cache --max-workers=2
      - name: Verify and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          scripts/verify-release-apk.sh ImapNotes3/build/outputs/apk/release/*.apk "$RELEASE_TAG"
          mkdir -p release-assets
          cp ImapNotes3/build/outputs/apk/release/*.apk release-assets/
          (cd release-assets && sha256sum *.apk > SHA256SUMS)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "ImapNotes3 $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
