name: Android checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --no-configuration-cache --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-and-reports
          path: |
            ImapNotes3/build/outputs/apk/debug/*.apk
            ImapNotes3/build/reports/
