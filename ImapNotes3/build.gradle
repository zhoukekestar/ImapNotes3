apply plugin: 'com.android.application'

android {
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    compileSdk 37
    buildToolsVersion "37.0.0"

    //noinspection GroovyMissingReturnStatement
    defaultConfig {
        applicationId "io.github.zhoukekestar.imapnotes3"
        versionCode 10410
        versionName "1.4.8-microg.3"
        targetSdkVersion 35
        minSdkVersion 25
        testInstrumentationRunner "de.niendo.ImapNotes3.Miscs.GoogleLoginInstrumentation"
        buildConfigField 'String', 'APPLICATION_NAME', '"ImapNotes3"'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release

            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled false

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources false

            // Includes the default ProGuard rules fil es that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'

        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "${project.name}-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    //noinspection GroovyMissingReturnStatement
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'de.niendo.ImapNotes3'
    buildFeatures {
        buildConfig true
        aidl true
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    lint { warning 'MissingTranslation' }

    //lint {
    //    baseline = file("lint-baseline.xml")
    //}
}

dependencies {
    //implementation 'com.google.android.gms:play-services-auth:21.5.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation 'com.sun.mail:android-activation:1.6.8'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'com.github.niendo1:richeditor-android:3.0.4'
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'org.jsoup:jsoup:1.23.1'
    implementation 'io.github.eltos:simpledialogfragments:3.10'
    implementation 'com.github.woheller69:FreeDroidWarn:V1.14'
    testImplementation 'junit:junit:4.13.2'
}

